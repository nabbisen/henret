name: supply-chain-refresh

# RFC 104: this audit never mutates a release or source. It fails visibly when
# a reviewed update to ci/supply-chain.json and workflow literals is available.
on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Compare immutable pins with upstream release refs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_supply_chain.py --check-updates
