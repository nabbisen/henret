name: release-gate

# RFC 080 / RFC 097: CI is the authoritative source of release evidence. Pull
# requests run the fast gate; pushes to main and version-tag pushes run the
# release-core gate (build/proofs/audit/docs/package) and publish the hashed
# verification manifest. The demo and exhaustive conformance executables are
# advisory and run in the separate, non-blocking release-validation workflow.
#
# Tag convention: GitHub release tags are bare (no "v"), e.g. 0.34.4. Published
# release assets are likewise no-v (henret-0.34.4.tar.gz, ...); local/dev
# tarballs keep the v-prefix (RFC 095 filename convention).

# The release job creates a GitHub Release and uploads assets, so the
# GITHUB_TOKEN needs write access to repository contents. Without this,
# gh release create/upload returns HTTP 403 (read-only default token).
permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install elan + Lean toolchain
        run: |
          # Install into /tmp so the elan-init binary never lands in the
          # checkout (it is untracked + not in the tarball excludes, so it
          # would otherwise dirty the source tree AND pollute the archive).
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
          tar xzf /tmp/elan.tar.gz -C /tmp
          /tmp/elan-init -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake build
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Fast gate (pull requests)
        if: github.event_name == 'pull_request'
        run: bash scripts/check.sh --fast

      - name: Release-core gate (push / tag - authoritative)
        # Core gates only (no native executable build): library/proof build,
        # axiom audit, doc/metadata checks, warning budget, canonical tarball,
        # hashed manifest. Completes well within the runner budget.
        if: github.event_name == 'push'
        env:
          HENRET_PUBLISH_NAME: "1"   # publish no-v asset names (henret-X.Y.Z.*)
        run: bash scripts/check.sh --release-core

      - name: Upload release evidence (workflow artifact, all pushes)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: |
            release/release-verification.json
            release/GATE-RUN.md
            release/logs/
          if-no-files-found: error

      - name: Publish release assets (tag only)
        # Attach the canonical no-v tarball + sidecar + GATE-RUN.md to the GitHub
        # Release so consumers (iotakt/jemmet) can fetch the RFC 095 sidecar beside
        # the tarball. Names are no-v and match the manifest's source_archive.name.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oE 'v!"[0-9]+\.[0-9]+\.[0-9]+"' lakefile.lean \
                    | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ "$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "FAIL: tag ${GITHUB_REF_NAME} != lakefile version ${VERSION}"; exit 1
          fi
          cp release/release-verification.json "release/henret-${VERSION}.release-verification.json"
          cp release/GATE-RUN.md               "release/henret-${VERSION}.GATE-RUN.md"
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
          gh release upload "${GITHUB_REF_NAME}" \
            "release/henret-${VERSION}.tar.gz" \
            "release/henret-${VERSION}.release-verification.json" \
            "release/henret-${VERSION}.GATE-RUN.md" \
            --clobber

      - name: Post-upload verification (tag only)
        # RFC 095 / RFC 097 closure: re-download the *published* assets and verify
        # the tarball sha256, the GATE-RUN hash binding, and that required gates
        # passed. This catches upload corruption or a wrong-asset upload that the
        # pre-upload manifest generation cannot see. A failure here means the
        # release is not valid even though the local artifacts were correct.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D=/tmp/verify-dl; rm -rf "$D"; mkdir -p "$D"
          gh release download "${GITHUB_REF_NAME}" \
            -p "henret-${GITHUB_REF_NAME}.tar.gz" \
            -p "henret-${GITHUB_REF_NAME}.release-verification.json" \
            -p "henret-${GITHUB_REF_NAME}.GATE-RUN.md" \
            -D "$D" --clobber
          python3 scripts/verify_release_manifest.py \
            "$D/henret-${GITHUB_REF_NAME}.release-verification.json" \
            "$D/henret-${GITHUB_REF_NAME}.tar.gz" \
            "$D/henret-${GITHUB_REF_NAME}.GATE-RUN.md"
