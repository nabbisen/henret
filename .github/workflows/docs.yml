name: docs-gate

# RFC 094: documentation integrity is a separate gate from the Lean release
# gate (.github/workflows/ci.yml). It builds the mdBook (0.5 line) and runs the
# orphan / local-link checks. A checksum-pinned mdBook release is installed
# from its prebuilt binary so the gate does not trust a host-provided mdBook.

on:
  push:
    branches: [main]
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned mdBook
        run: |
          python3 scripts/install_ci_tool.py mdbook --destination /tmp/henret-mdbook
          echo "/tmp/henret-mdbook" >> "$GITHUB_PATH"
          /tmp/henret-mdbook/mdbook --version

      - name: Documentation gate
        run: bash scripts/check_docs.sh
