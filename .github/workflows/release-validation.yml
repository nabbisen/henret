name: release-validation

# RFC 102 supplemental timing/diagnostic rerun of demo (gate 2) and exhaustive
# conformance (gate 4). Both are already required by the current release core; this
# non-blocking workflow is never evidence in place of those required results.
# The report remains a workflow artifact; this
# workflow never mutates a frozen GitHub Release. Runs on version-tag pushes
# and on manual dispatch.

permissions:
  contents: read

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45    # bound the non-blocking waste; demo runs before
    # conformance, so even a timeout yields the per-gate diagnostic timing
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install checksum-pinned Lean toolchain
        run: |
          python3 scripts/install_ci_tool.py lean --destination /tmp/henret-lean
          echo "/tmp/henret-lean/lean-4.15.0-linux/bin" >> "$GITHUB_PATH"
          /tmp/henret-lean/lean-4.15.0-linux/bin/lean --version

      - name: Cache Lake build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Supplemental release-validation diagnostics
        env:
          HENRET_PUBLISH_NAME: "1"
          # Supplemental bounds may be larger than the required release-core
          # limits to diagnose cold-run timing without authorizing publication.
          HENRET_DEMO_TIMEOUT: "180"
          HENRET_CONF_TIMEOUT: "1500"
        run: bash scripts/check.sh --release-validation

      - name: Upload validation report (workflow artifact)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-validation-report
          path: |
            release/*.validation-report.json
            release/*.validation-GATE-RUN.md
            release/logs/
          if-no-files-found: warn
